# RNV Manager - Stack: PostgreSQL + Go API + Next.js
# Traefik → app (Next.js) → proxy /api/* → go-api (red interna)
services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-rnvadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rnv_secure_password_2025}
      POSTGRES_DB: ${DB_NAME:-rnv_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - rnv_net
    deploy:
      restart_policy:
        condition: on-failure

  # ── Go API Backend (solo red interna; Next.js hace proxy de /api) ─────────
  go-api:
    image: rnv-manger-go-api:${GIT_SHA:-latest}
    build:
      context: ./rnv-go-api
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando PostgreSQL..."
        for i in $$(seq 1 60); do
          nc -z db 5432 && break
          sleep 2
        done
        exec ./rnv-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      APP_URL: ${APP_URL:-https://rnv.renace.tech}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN:-}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USERNAME: ${ODOO_USERNAME:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./backups:/backups:ro
    networks:
      - rnv_net
    healthcheck:
      disable: true
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        failure_action: continue
        order: start-first

  # ── Next.js Frontend (UI + proxy /api → go-api) ───────────────────────────
  app:
    image: rnv-manger-app:${GIT_SHA:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - rnv_net
      - RenaceNet
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.rnv-app.rule=Host(`rnv.renace.tech`)"
        - "traefik.http.routers.rnv-app.entrypoints=websecure"
        - "traefik.http.routers.rnv-app.tls=true"
        - "traefik.http.routers.rnv-app.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.rnv-app.loadbalancer.server.port=3000"

  # ── Daily DB Backup ────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-rnvadmin}
      PGPASSWORD: ${DB_PASSWORD:-rnv_secure_password_2025}
      PGDATABASE: ${DB_NAME:-rnv_manager}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command: >
      -c "
        while true; do
          pg_dump -Fc > /backups/rnv_manager_$$(date +%Y%m%d_%H%M%S).dump
          ls -t /backups/*.dump 2>/dev/null | tail -n +8 | xargs -r rm
          sleep 86400
        done
      "
    networks:
      - rnv_net
    deploy:
      restart_policy:
        condition: on-failure

networks:
  rnv_net:
    driver: overlay
    attachable: true
  RenaceNet:
    external: true

volumes:
  postgres_data:
    name: rnv_postgres_data
